# Mooncell Console 服务配置

[server]
addr = "127.0.0.1" # 监听地址;生产若改 0.0.0.0,必须同步修改默认密码/token
port = 8787

[database]
path = "mooncell.db"   # sqlite 文件路径,首次运行自动创建

[session]
ttl_hours = 1   # 闲置超时(小时):有动作滑动续期,闲置满该时长自动退出;配合 session cookie(关浏览器即清)

[admin]
# 仅在用户表为空时用于种入默认管理员(bcrypt 存储);
# 库已存在用户后修改此处不会改动已有账号。
username = "admin"
password = "1qaz@WSX"

[agent]
# Console 主动连接的 Agent;单机版默认指向本机 Agent。
# token 须与 Agent 端 config.toml 的 [security] token 一致。
addr  = "127.0.0.1:9100"
token = "mc_ag_change_me"

[deploy]
# 部署制品上传的传输层硬上限(MB)。超出在传输层截断并回 413,防超大制品撑爆磁盘。
# 浏览器→Console 大文件(>16MB)走分块上传 + 断点续传(已实现);此上限同时约束分块总量。默认 1024MB。
max_upload_mb = 1024

# 服务器运维：远程 Linux SSH/SFTP/Web 终端。
# 任意远程 shell 是高权限能力。升级后默认关闭，确认 HTTPS、网络可达与授权后再开启。
[server_operations]
enabled = false
connect_timeout_seconds = 15
idle_timeout_minutes = 30
max_session_hours = 8
max_sessions_per_user = 3
max_sessions_total = 30
sftp_max_upload_mb = 1024
sftp_max_download_mb = 2048
sftp_max_transfers_per_user = 2
sftp_max_transfers_total = 10
transfer_resume_hours = 24
zmodem_max_transfer_mb = 512
