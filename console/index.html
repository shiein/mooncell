<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mooncell · 部署控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='36' y='36' width='48' height='48' rx='11' fill='%23C05B33'/%3E%3Ccircle cx='56' cy='56' r='15' fill='%23fff'/%3E%3Ccircle cx='64' cy='52' r='13' fill='%23C05B33'/%3E%3C/svg%3E">
</head>
<body>
  <div id="root"></div>
  <script>
    // Chrome 92 无 structuredClone（98+），@xyflow/react 运行时会调用——
    // vite define 已把依赖里的 structuredClone 重写为 __mcStructuredClone，
    // 这里提供实现：优先原生，缺失时递归克隆（支持循环引用/Date/Map/Set/RegExp/TypedArray）。
    window.__mcStructuredClone = (typeof structuredClone === 'function')
      ? structuredClone
      : (function () {
        function clone(v, seen) {
          if (v === null || typeof v !== 'object') return v;
          if (seen.has(v)) return seen.get(v);
          if (v instanceof Date) return new Date(v.getTime());
          if (v instanceof RegExp) return new RegExp(v.source, v.flags);
          if (ArrayBuffer.isView(v)) return new v.constructor(v);
          var out;
          if (v instanceof Map) {
            out = new Map(); seen.set(v, out);
            v.forEach(function (val, key) { out.set(clone(key, seen), clone(val, seen)); });
            return out;
          }
          if (v instanceof Set) {
            out = new Set(); seen.set(v, out);
            v.forEach(function (val) { out.add(clone(val, seen)); });
            return out;
          }
          out = Array.isArray(v) ? [] : {};
          seen.set(v, out);
          for (var k in v) {
            if (Object.prototype.hasOwnProperty.call(v, k)) out[k] = clone(v[k], seen);
          }
          return out;
        }
        return function (value) { return clone(value, new WeakMap()); };
      })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
